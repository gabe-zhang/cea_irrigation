[project]
name = "cea-irrigation"
version = "0.1.0"
description = "AI-powered automated irrigation system for Controlled Environment Agriculture on Raspberry Pi 5"
readme = "README.md"
authors = [
    { name = "James Y. Kim", email = "james.y.kim@usda.gov" },
    { name = "Yuan Zhang" },
]
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.26.0",
    "ai-edge-litert>=2.2.0",
    "tkcalendar>=1.6.1",
]

[project.optional-dependencies]
gui = [
    "opencv-python>=4.8.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "coral: marks tests requiring Google Coral Edge TPU hardware (skipped by default, pass --coral to run)",
]



